name: baotuo-ai-family

services:
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/baotuo88/baotuo-ai-family:latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    # Compose >= 2.30: preserve literal $ and quotes in credentials/ACP arguments.
    env_file:
      - path: ${GATEWAY_ENV_FILE:-.env}
        format: raw
    environment:
      GATEWAY_AUTO_CONFIGURE: ${GATEWAY_AUTO_CONFIGURE:-1}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "18080"
      DATA_DIR: /data
      HOME: /data/home
      CODEX_CLI_HOME: /data/codex-home
      CODEX_ADMIN_HOME: /data/codex-home
      CODEX_FAMILY_HOME: /data/codex-home
      CODEX_ADMIN_WORKSPACE: /data/runtime/admin
      CODEX_FAMILY_WORKSPACE: /data/runtime/family
      FILE_SEND_ALLOWED_DIRS: /data/outbox:/data/inbox:/data/office
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-18080}:18080"
    volumes:
      - gateway-data:/data
    stop_grace_period: 3m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-data:
    name: ${GATEWAY_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-baotuo-ai-family}_gateway-data}
